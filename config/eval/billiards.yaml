defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/Billiards-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: 300   # matches MAX_STEPS in game.py
  history_size: 1
  frame_skip: 1

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - state

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 1  # frameskip=1 for billiards

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 96
  dataset_name: billiards_expert_train
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: billiards_results.txt
