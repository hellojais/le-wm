defaults:
  - _self_
  - data: billiards

output_model_name: lewm_auxloss_full
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 96
patch_size: 8
encoder_scale: tiny
dump_object: True

# ── Frame-stacking + auxiliary state supervision (full 10-epoch run) ─────────
use_frame_stacking: true
in_chans: 9

use_aux_loss: true

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: "32"
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: 0
  persistent_workers: False
  pin_memory: False

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: False
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 32

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.01
    kwargs:
      knots: 17
      num_proj: 1024
  aux_state:
    weight: 0.1
    state_dim: 10
