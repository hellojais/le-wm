defaults:
  - _self_
  - data: billiards

output_model_name: lewm_framestacked
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 96
patch_size: 8
encoder_scale: tiny
dump_object: True

# ── Frame-stacking experiment flags ─────────────────────────────────────────
# Stack 3 consecutive frames as 9 input channels so the ViT encoder sees
# explicit optical-flow signal from its very first layer.
use_frame_stacking: true
in_chans: 9             # passed as num_channels to ViTConfig (default 3)

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: "32"
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: 0
  persistent_workers: False
  pin_memory: False

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: False
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 32

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.01
    kwargs:
      knots: 17
      num_proj: 1024
